name: Central payments
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/central-payments.yml']
permissions:
  contents: read
jobs:
  payment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, xmlwriter, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: php artisan test --filter='ConsumerPaymentTest|SnippeLivePaymentTest|AdminAnalyticsSupportTest|AdminPermissionsTest|ResendPaymentPushTest'
        working-directory: backend
        env:
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
